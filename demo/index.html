<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>octoloader — demo</title>
    <style>
      body {
        margin: 0;
        font:
          16px/1.6 ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      }
      section {
        min-height: 100vh;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 3rem;
        padding: 3rem 1.5rem;
      }
      .light {
        background: #fff;
        color: #57606a;
      }
      .dark {
        background: #0d1117;
        color: #8b949e;
        --octo-pupil: #0d1117;
        --octo-paper: #c9d1d9;
      }
      .row {
        display: flex;
        align-items: flex-end;
        gap: 2.5rem;
        flex-wrap: wrap;
        justify-content: center;
      }
      h1 {
        font-size: 0.75rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        opacity: 0.6;
        margin: 0;
        font-weight: 500;
      }
      h2 {
        font-size: 0.7rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        opacity: 0.45;
        margin: 0 0 0.75rem;
        font-weight: 500;
        text-align: center;
      }
      /* The delayed one appears out of nothing — hold its space so nothing jumps. */
      .slot {
        min-height: 130px;
        display: grid;
        place-items: center;
      }
    </style>
  </head>
  <body>
    <section class="light">
      <h1>Light page</h1>
      <octo-loader variant="color" size="90" label="One moment please…"></octo-loader>

      <div>
        <h2>Sizes — 30, 60, 120</h2>
        <div class="row">
          <octo-loader variant="mono" size="30" label=""></octo-loader>
          <octo-loader variant="mono" size="60" label=""></octo-loader>
          <octo-loader variant="mono" size="120" label=""></octo-loader>
        </div>
      </div>

      <div>
        <h2>Determinate</h2>
        <octo-loader
          class="metered"
          variant="color"
          size="90"
          progress="0"
          label="Uploading… 0%"
        ></octo-loader>
      </div>

      <div>
        <h2>In a panel</h2>
        <octo-loader
          frame
          variant="color"
          label="Loading your projects"
          description="This usually takes a few seconds."
        ></octo-loader>
      </div>

      <div>
        <h2>Delayed by 1.5s, then it loops</h2>
        <div class="slot">
          <octo-loader class="late" variant="color" size="90" delay="1500" label=""></octo-loader>
        </div>
      </div>
    </section>

    <section class="dark">
      <h1>Dark page</h1>
      <octo-loader variant="color" size="90" label="One moment please…"></octo-loader>

      <div>
        <h2>Sizes — 30, 60, 120</h2>
        <div class="row">
          <octo-loader variant="mono" size="30" label=""></octo-loader>
          <octo-loader variant="mono" size="60" label=""></octo-loader>
          <octo-loader variant="mono" size="120" label=""></octo-loader>
        </div>
      </div>

      <div>
        <h2>Determinate</h2>
        <octo-loader
          class="metered"
          variant="mono"
          size="90"
          progress="0"
          label="Uploading… 0%"
        ></octo-loader>
      </div>

      <div>
        <h2>Panel retuned by tokens</h2>
        <octo-loader
          frame
          variant="mono"
          size="30"
          label="Checking status…"
          style="
            --octo-frame-min-height: 9rem;
            --octo-frame-padding: 1.5rem;
            --octo-frame-radius: 4px;
            --octo-frame: rgba(76, 201, 240, 0.5);
          "
        ></octo-loader>
      </div>

      <div>
        <h2>In a panel, held to 320px</h2>
        <octo-loader
          frame
          variant="mono"
          size="90"
          label="One moment please…"
          style="max-width: 320px"
        ></octo-loader>
      </div>

      <div>
        <h2>Speed 0.5 / 1 / 2</h2>
        <div class="row">
          <octo-loader variant="mono" size="60" speed="0.5" label=""></octo-loader>
          <octo-loader variant="mono" size="60" speed="1" label=""></octo-loader>
          <octo-loader variant="mono" size="60" speed="2" label=""></octo-loader>
        </div>
      </div>
    </section>

    <!-- Needs `npm run build` first, and a server — browsers refuse module
       imports over file://. `npx serve .` from the repo root, then open
       /demo/. -->
    <script type="module" src="../dist/element.js"></script>
    <script type="module">
      // Walk the determinate ones up and start over, so the bar is visible doing
      // its whole range rather than parked at one value.
      let p = 0;
      setInterval(() => {
        p = p >= 1 ? 0 : Math.min(1, p + 0.02);
        for (const el of document.querySelectorAll('.metered')) {
          el.setAttribute('progress', String(p));
          el.setAttribute('label', `Uploading… ${Math.round(p * 100)}%`);
        }
      }, 120);

      // Take the delayed one away and put it back, so the wait is visible too.
      const late = document.querySelector('.late');
      const slot = late.parentElement;
      setInterval(() => {
        if (late.isConnected) late.remove();
        else slot.append(late);
      }, 4000);
    </script>
  </body>
</html>
