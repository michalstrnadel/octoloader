name: Release

# Push a tag, get a published package. Nothing publishes from a laptop.
#
# Authentication is npm's trusted publishing: the registry accepts a short-lived
# OIDC token minted by this workflow instead of a long-lived secret, so there is
# no NPM_TOKEN to leak or rotate. It also means npm can attest where the tarball
# came from — the provenance badge on the package page links back to this run.
#
# One-time setup on npmjs.com, under the package's Settings → Trusted publisher:
#   organisation/user  michalstrnadel
#   repository         octoloader
#   workflow           release.yml
# The first publish of a brand-new name has to be done by hand, because there is
# no package page to configure yet. Everything after that comes through here.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # to cut the GitHub release
  id-token: write # to mint the OIDC token npm checks

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs a recent npm; the bundled one may lag.
      - run: npm install -g npm@latest

      - run: npm ci

      # A tag that disagrees with package.json publishes the wrong number under
      # the right name, and npm will not let you take it back.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag but package.json says $pkg"
            exit 1
          fi

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Idempotent on purpose. The first version was published by hand — a new
      # name cannot have a trusted publisher configured before it exists — so a
      # tag for it must not fail the run. Re-running a release is then safe too.
      - name: Publish, unless that version is already out
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "octoloader@$version" version >/dev/null 2>&1; then
            echo "octoloader@$version is already on the registry — skipping" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            npm publish
          fi

      - name: Cut the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
