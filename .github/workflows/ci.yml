name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The toolchain needs 20+ — vitest reaches for node:util's styleText.
        # The published package is browser ESM and touches no Node API at all.
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The lockfile is resolved with a current npm; older ones bundled with a
      # Node release disagree about optional platform dependencies and reject it.
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # Generated from the class and its JSDoc, so a stale copy in the tree
      # means the published manifest lies about the element's API.
      - name: Check the custom elements manifest is current
        run: |
          npm run cem
          git diff --exit-code --stat custom-elements.json \
            || { echo "::error::custom-elements.json is stale — run npm run cem"; exit 1; }

      # The sprite is the product. A regression here is a bigger deal than a
      # few extra bytes, but silent growth is how a 4 kB loader becomes 40.
      - name: Report gzipped size
        if: matrix.node == 24
        run: |
          size=$(cat dist/index.js dist/chunk-*.js | gzip -9 | wc -c)
          echo "React entry: ${size} B gzipped" >> "$GITHUB_STEP_SUMMARY"

  browser:
    name: browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run build

      # Chromium only. These assert what the engine did with the stylesheet,
      # not how it looks, so a second engine would cost minutes to re-confirm
      # the same three facts.
      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
